# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# CodeRabbit 설정 — TikiTaka-app
# 프로젝트 규약은 AGENTS.md 를 따릅니다. 아래 path_instructions 는 그 규약을 리뷰에 반영하기 위한 요약입니다.

language: ko-KR # 리뷰/요약을 한국어로 작성

reviews:
  profile: chill # 사소한 지적보다 중요한 이슈 위주
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  poem: false

  auto_review:
    enabled: true
    drafts: false # Draft PR 은 리뷰하지 않음
    base_branches:
      - main

  # 리뷰 대상에서 제외할 경로 (자동 생성물 · 네이티브 · 에셋 · 락파일)
  path_filters:
    - '!**/node_modules/**'
    - '!ios/**'
    - '!android/**'
    - '!assets/**'
    - '!pnpm-lock.yaml'
    - '!.expo/**'
    - '!expo-env.d.ts'

  # 경로별 리뷰 지침 (AGENTS.md 규약 기반)
  path_instructions:
    - path: '**/*.{ts,tsx}'
      instructions: |
        - 컴포넌트 선언은 `export default function Name() {}` 형태로 통일한다.
          예외: memo/forwardRef 로 감싸는 경우, 파일 내부 전용 소형 헬퍼 컴포넌트.
        - 함수형 컴포넌트/훅과 명확한 TypeScript 타입/인터페이스를 사용한다. `any` 지양.
        - React Compiler(reactCompiler)가 켜져 있으므로 useMemo/useCallback/React.memo 를
          습관적으로 남발하지 않는다. 참조 동일성이 외부 계약상 꼭 필요한 경우에만 사용한다.
        - Expo Router 라우트 경로는 typedRoutes 로 타입 체크되므로 문자열 리터럴로 넘긴다.
        - API 호출은 Axios(`src/api/client.ts`)로 래핑하고, 비동기 상태는 TanStack Query
          (useQuery/useMutation)로 관리한다.
        - 기존 주석/Docstring 을 훼손하지 않고 보존한다.
    - path: 'src/components/**/*.tsx'
      instructions: |
        - 스타일은 인라인 style 이나 StyleSheet.create 대신 NativeWind className 을 사용한다.
        - 색상/간격/반경/폰트는 tailwind.config.js 의 토큰만 사용한다.
          임의값(`p-[13px]`, `text-[#FF8800]`, `bg-[#123456]`)을 지양한다.
        - 텍스트는 raw <Text> 대신 `Typography` 컴포넌트와 variant 를 사용한다.
        - 도메인 무관 재사용 UI 는 `src/components/ui/`, 특정 도메인 전용은
          `src/components/<도메인>/` 에 둔다. `ui/` 하위에 도메인명 폴더를 만들지 않는다.
        - 동적으로 조합되는 NativeWind 클래스는 tailwind.config.js 의 safelist 등록이
          필요할 수 있음을 확인한다.
    - path: 'src/constants/character/**/*.ts'
      instructions: |
        - 캐릭터는 이미지가 아니라 CharacterConfig(파츠 id JSON)로 표현한다.
        - 새 파츠 에셋은 assets.ts 의 정적 레지스트리에 `id ↔ require(...)`로 직접 매핑해야
          한다(동적 경로 require 불가). 매핑 누락 시 화면에 나타나지 않는다.
        - 레이어(그리는 순서, z-index)는 types.ts 의 LAYERS 배열로만 관리한다.
    - path: '**/package.json'
      instructions: |
        - 패키지 매니저는 pnpm 만 사용한다(npm/yarn/bun 금지). `packageManager` 필드를 유지한다.
        - Expo 의존성은 `pnpm expo install` 로 SDK 호환 버전을 맞춘다.
    - path: '.npmrc'
      instructions: |
        - `node_linker=hoisted` 설정을 제거/변경하지 않는다(네이티브 오토링크 문제 방지).
    - path: 'eas.json'
      instructions: |
        - 각 빌드 프로필의 `EXPO_USE_PNPM=1` 환경변수를 제거하지 않는다.

  tools:
    eslint:
      enabled: true # 프로젝트 ESLint(eslint.config.js) 규칙 반영
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    gitleaks:
      enabled: true # 커밋에 유출된 시크릿 검사
    actionlint:
      enabled: true # GitHub Actions 워크플로 검사

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
